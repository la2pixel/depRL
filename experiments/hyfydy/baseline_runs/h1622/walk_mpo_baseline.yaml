tonic:
  after_training: ''
  header: "import deprl, gym, sconegym"
  agent: "deprl.custom_agents.dep_factory(0, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(return_steps=1,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=1e5,
    num_acts=22))"
  before_training: ''
  checkpoint: "last"
  environment: "deprl.environments.Gym('sconewalk_h1622-v1', scaled_actions=False)"
  full_save: 1
  name: "lalitha/walk_mpo_h1622_baseline"
  resume: false
  seed: 0
  parallel: 20
  sequential: 10
  test_environment: null
  trainer: "deprl.custom_trainer.Trainer(steps=int(2e7), epoch_steps=int(2e5), save_steps=int(2e6))"

working_dir: "IGNORED_FOR_HYFYDY"

env_args:
  clip_actions: true
  vel_coeff: 10
  grf_coeff: -0.17281
  joint_limit_coeff: -0.1307
  smooth_coeff: -0.097
  nmuscle_coeff: -1.57929
  self_contact_coeff: 0
  step_size: 0.025
  run: false
  init_activations_mean: 0.01
  init_activations_std: 0

wandb:
  project: "leaps"
  name: "lalitha/walk_mpo_h1622_baseline"
  group: "h1622_baselines"
