tonic:
  after_training: ''
  header: "import deprl, gym, sconegym"
  agent: "deprl.custom_agents.dep_factory(0, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=1,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=1e6))"
  before_training: ''
  checkpoint: "last"
  environment: "deprl.environments.Gym('sconerun_h2190_onlyVelRew-v1', scaled_actions=False)"
  full_save: 1
  name: "lalitha/run_mpo_h2190_onlyVelRew"
  resume: false
  seed: 0
  parallel: 20
  sequential: 10
  test_environment: null
  trainer: "deprl.custom_trainer.Trainer(steps=int(2e7), epoch_steps=int(2e5), save_steps=int(2e6))"

working_dir: "IGNORED_FOR_HYFYDY"

env_args:
  clip_actions: false
  vel_coeff: 1
  grf_coeff: 0
  joint_limit_coeff: 0
  smooth_coeff: 0
  nmuscle_coeff: 0
  self_contact_coeff: 0
  step_size: 0.025
  run: true
  init_activations_mean: 0.01
  init_activations_std: 0

mpo_args:
  hidden_size: 1024
  lr_actor: 3.53e-05
  lr_critic: 6.081e-05
  lr_dual: 0.00213

wandb:
  project: "leaps"
  name: "lalitha/run_mpo_h2190_onlyVelRew"
  group: "onlyVelRew_baselines"
